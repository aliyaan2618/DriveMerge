<!doctype html>
<!-- Shown in the browser after signing in to a cloud service. Go template filled by `rclone authorize --template`:
     .OK (bool), .Name and .Description (error details). Keep it self-contained: no external files. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .OK }}Signed in · DriveMerge{{ else }}Sign-in didn't work · DriveMerge{{ end }}</title>
<style>
  :root { --bg: #f1f0ec; --card: #fff; --border: #e6e5e0; --text: #18181b; --muted: #6b6b76; --ok: #22a06b; --bad: #e5484d; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --card: #17171b; --border: #27272e; --text: #f2f2f5; --muted: #8a8a96; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 1px 3px #0000000a; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--text); }
  .icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; color: #fff; font-size: 24px; font-weight: 700; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
  .detail { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--text); text-align: left; word-break: break-word; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark" aria-hidden="true"></span> DriveMerge</div>
    {{ if .OK }}
      <div class="icon" style="background: var(--ok)" aria-hidden="true">✓</div>
      <h1>You're signed in</h1>
      <p>DriveMerge has your sign-in and is back in front. You can close this tab.</p>
    {{ else }}
      <div class="icon" style="background: var(--bad)" aria-hidden="true">!</div>
      <h1>Sign-in didn't work</h1>
      <p>Go back to DriveMerge and click Sign in to try again.</p>
      <p class="detail">{{ .Name }}{{ if .Description }}: {{ .Description }}{{ end }}</p>
    {{ end }}
  </main>
</body>
</html>
